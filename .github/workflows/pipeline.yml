name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/
      - run: pytest -q

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repo for GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build
        run: docker build -t ghcr.io/${{ env.REPO_LC }}:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

  deploy:
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repo for GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: helm/kind-action@v1
      - uses: azure/setup-kubectl@v4
      - name: Point manifests at this SHA
        run: 'sed -i "s|image: .*|image: ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}|" k8s/deployment.yaml'
      - name: Deploy to kind
        run: | 
          kubectl apply -f k8s/
          kubectl rollout status deployment/app --timeout=120s
      - name: Smoke test
        run: |
          kubectl port-forward svc/app 8000:80 &
          sleep 5
          for i in $(seq 1 20); do curl -sf http://localhost:8000/health || exit 1; sleep 2; done
          curl -sf -X POST -H "Content-Type: application/json" -d '{"query":"Who was Aryabhata?","top_k":2}' http://localhost:8000/ask | grep -q "Aryabhata"
