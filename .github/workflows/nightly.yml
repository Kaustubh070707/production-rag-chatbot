name: nightly-eval

on:
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC daily
  workflow_dispatch:        # manual button in Actions tab

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/
      - run: pytest -q
      - name: BM25 eval (no API key needed, sweep includes production floor 0.3)
        env:
          PYTHONPATH: .
        run: |
          date -u +"## %Y-%m-%d" >> eval/history.log
          python eval/run_eval_bm25.py >> eval/history.log 2>&1
      - name: Commit results
        run: |
          git config user.name "Kaustubh070707"
          git config user.email "Kaustubh070707@users.noreply.github.com"
          git add eval/history.log
          git commit -m "nightly: eval results (automated)" || echo "no change"
          git push
